# Dev:   docker compose up -d                  -> chỉ PostgreSQL (chạy API bằng npm run start:dev)
# Chạy cả API trong container: docker compose --profile app up -d --build
#        (cần đặt JWT_SECRET trong .env hoặc môi trường)
services:
  postgres:
    image: postgres:18
    container_name: datve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-datve_db}
      POSTGRES_USER: ${DB_USERNAME:-datve_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only_12345}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-datve_db}
      DB_USERNAME: ${DB_USERNAME:-datve_user}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_only_12345}
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET (openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      APP_URL: ${APP_URL:-http://localhost:5173}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-ĐặtVé <no-reply@datve.local>}
      REFUND_WINDOW_HOURS: ${REFUND_WINDOW_HOURS:-24}
    # Áp dụng migration rồi mới nhận request
    command: ["sh", "-c", "node scripts/migrate.js && node dist/main"]
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
